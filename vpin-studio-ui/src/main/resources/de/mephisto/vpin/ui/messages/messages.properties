pref.title=VPIN STUDIO PREFERENCES
pref.client.title=Client Settings
pref.client.description=Miscellaneous options for the user interface can be configured here.

pref.client.language.title=Language
pref.client.language.description=Choose the display language for VPin Studio. A restart is required to apply the change.
pref.client.language.restart_hint=Please restart the client to apply the language change.
pref.client.language.restart_message=Language changed. Please restart VPin Studio to apply the new language.
pref.client.language.english=English
pref.client.language.german=Deutsch

pref.client.emulators.title=Emulators
pref.client.emulators.description1=This section configures which game emulators are visible for the Studio.
pref.client.emulators.description2=The unchecked emulators will remain active for the frontend, but won't be shown in the different views.

pref.client.dropin.title=Drop-In Folder
pref.client.dropin.enable=Enable "Drop-In" folder imports
pref.client.dropin.description=If checked, new files of the selected drop-in folder will be shown in the menu once the download is finished.
pref.client.dropin.action=Once the file is installed, choose an action to perform:
pref.client.dropin.action.nothing=Do nothing
pref.client.dropin.action.move=Move to folder
pref.client.dropin.action.ask=Ask for a folder and move the file into it
pref.client.dropin.action.delete=Delete the file
pref.client.dropin.action.trash=Move to trash
pref.client.dropin.action.pertable=Use a folder per table
pref.client.dropin.confirm=Confirm Deletion
pref.client.select.folder=Select Folder...

pref.client.overview.title=Table Overview Settings
pref.client.overview.description=You can customize the appearance of the table overview here.
pref.client.overview.show_version=Show table version update indicators in the table overview.
pref.client.overview.version_hint1=The table update icon is shown when there is a version mismatch between your table version
pref.client.overview.version_hint2=and the associated "Virtual Pinball Spreadsheet" table version.
pref.client.overview.auto_edit=Edit table data after upload.
pref.client.overview.auto_edit_hint=If checked, the table data dialog will open after a new table has been uploaded.
pref.client.overview.material_icons=Use Material UI playlist icons instead of custom ones.
pref.client.overview.material_icons_hint=If checked, only Material UI icons will be used for all playlists.
pref.client.overview.green_marker=Use green check marker icons for tables with no issues.
pref.client.overview.green_marker_hint=If checked, a green check marker icon is shown for tables with no issues.

