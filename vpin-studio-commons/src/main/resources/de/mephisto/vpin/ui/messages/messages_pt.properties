studio.splash.fact.1=O primeiro jogo conhecido semelhante ao pinball, a «Bagatela», originou-se na França no século XVIII.
studio.splash.fact.2=A Bagatela foi introduzida nos Estados Unidos no século XIX, onde evoluiu para um popular jogo de salão.
studio.splash.fact.3=O jogo semelhante ao pinball foi criado por Montague Redgrave em 1871. Ele patenteou um lançador de mola para disparar a bola, uma característica ainda usada hoje.
studio.splash.fact.4=O nome do jogo evoluiu de «Bagatela» para «mesa de bolinhas» e finalmente «pinball» devido à adição de pinos na superfície de jogo.
studio.splash.fact.5=A máquina de pinball com moedas, Ballyhoo, foi criada em 1931 por Raymond Maloney.
studio.splash.fact.6=Nos primórdios, as máquinas de pinball eram consideradas jogos de azar e muitas estavam associadas ao jogo.
studio.splash.fact.7=Nas décadas de 1930 e 1940, a Gottlieb & Co. foi fundamental no desenvolvimento das primeiras máquinas de pinball, introduzindo inovações como os pop bumpers e as alavancas.
studio.splash.fact.8=Em 1932, o Baffle Ball era uma popular máquina de pinball que oferecia dez bolas por um centavo. Foi uma das primeiras a alcançar sucesso generalizado.
studio.splash.fact.9=A máquina de pinball «Contact» de 1933 foi a primeira a ter funções alimentadas eletricamente.
studio.splash.fact.10=A primeira máquina de pinball com mecanismo de inclinação para evitar que os jogadores a sacudissem excessivamente foi introduzida em 1934.
studio.splash.fact.11=O torneio Big Whiffle de 1935 foi a primeira competição oficial de pinball, abrindo caminho para eventos organizados que continuam até hoje.
studio.splash.fact.12=A máquina de pinball «Bumper» de 1936 marcou a introdução dos primeiros pop bumpers no campo de jogo.
studio.splash.fact.13=As máquinas de pinball foram proibidas em grandes cidades como Nova York e Los Angeles na década de 1940 devido a preocupações com o jogo.
studio.splash.fact.14=A máquina de pinball «Humpty Dumpty» da Gottlieb em 1947 introduziu os primeiros botões de alavanca, mudando a dinâmica do jogo.
studio.splash.fact.15=A máquina de pinball «Triple Action» de 1948 foi a primeira a incluir três alavancas no campo de jogo.
studio.splash.fact.16=A introdução das alavancas aumentou o controle do jogador, reduzindo o elemento de sorte e tornando o pinball mais baseado em habilidade.
studio.splash.fact.17=A década de 1950 viu o surgimento das máquinas de pinball como forma de entretenimento, levando à revogação de muitas proibições.
studio.splash.fact.18=Na década de 1950, componentes eletromecânicos, como relés e unidades de passo, começaram a ser integrados às máquinas de pinball, adicionando complexidade e novas funções de jogo.
studio.splash.fact.19=Na década de 1950, as máquinas de pinball começaram a apresentar temas baseados na cultura popular, filmes e programas de televisão.
studio.splash.fact.20=A máquina de pinball «Spot Bowler» de 1950 apresentava uma mini-boliche no campo de jogo.
studio.splash.fact.21=A máquina «Super Jumbo» da Williams em 1954 foi a primeira a ter um gabinete extra-largo.
studio.splash.fact.22=A máquina «Magic Clock» da Williams em 1960 apresentava um mostrador de relógio com ponteiros no backglass.
studio.splash.fact.23=A máquina «Gottlieb Slick Chick» de 1963 apresentava alavancas com fecho, permitindo aos jogadores controlar o movimento da bola.
studio.splash.fact.24=A máquina «Bank-A-Ball» da Gottlieb em 1965 introduziu a primeira função multiball.
studio.splash.fact.25=Em 1966, a máquina de pinball «Batman» tornou-se o primeiro jogo de pinball licenciado, com personagens da popular série de televisão.
studio.splash.fact.26=O pinball ganhou imensa popularidade nas décadas de 1970 e 1980, tornando-se uma atração indispensável nos fliperamas ao lado dos videogames.
studio.splash.fact.27=A transição para máquinas de pinball digitais começou no final da década de 1970, com a introdução de eletrônica de estado sólido, displays digitais e efeitos sonoros aprimorados.
studio.splash.fact.28=Máquinas de pinball temáticas, com referências à cultura popular, filmes e programas de televisão, começaram a aparecer na década de 1970, aumentando seu apelo e colecionabilidade.
studio.splash.fact.29=A máquina «Spirit of 76» da Micro Games em 1970 celebrava o bicentenário dos Estados Unidos.
studio.splash.fact.30=A década de 1970 viu o advento de componentes eletrônicos que substituíram muitas peças mecânicas nas máquinas de pinball.
studio.splash.fact.31=A máquina «Spanish Eyes» da Williams em 1970 foi uma das primeiras a apresentar alvos abatíveis.
studio.splash.fact.32=A máquina «Challenger» da Gottlieb em 1971 permitia competição frente a frente com um campo de jogo duplo, dois conjuntos de alavancas e backglass.
studio.splash.fact.33=«Fireball» da Bally, lançado em 1972, foi uma das primeiras máquinas de pinball a incluir uma caixa de voz mecânica que emitia sons.
studio.splash.fact.34=A ópera rock «Tommy» do The Who apresentava um personagem que era um mago do pinball, impulsionando a popularidade do jogo na década de 1970.
studio.splash.fact.35=A máquina «Spirit of 76» de 1975 apresentava um alvo giratório simulando o movimento de uma roleta.
studio.splash.fact.36=A máquina «Captain Fantastic» de 1976 apresentava arte inspirada no músico Elton John.
studio.splash.fact.37=A máquina «Fireball» da Bally em 1977 apresentava um disco giratório no centro do campo de jogo.
studio.splash.fact.38=A máquina de pinball «Gorgar» de 1979 foi a primeira a apresentar voz sintetizada, dizendo frases simples durante o jogo.
studio.splash.fact.39=O jogo «Black Knight» da Williams em 1979 introduziu o primeiro campo de jogo multinível, adicionando profundidade e complexidade ao gameplay.
studio.splash.fact.40=A década de 1980 viu um declínio na popularidade do pinball devido ao surgimento dos videogames.
studio.splash.fact.41=A máquina «Black Knight» da Williams em 1980 apresentava um botão Magna-Save permitindo aos jogadores salvar uma bola perdida.
studio.splash.fact.42=Lançada pela Gottlieb em 1982, «Haunted House» é famosa por suas oito alavancas e um subnível oculto.
studio.splash.fact.43=A máquina «Firepower II» de 1984 foi a primeira a utilizar display alfanumérico.
studio.splash.fact.44=A máquina «High Speed» da Williams em 1986 foi a primeira a usar displays alfanuméricos para pontuação.
studio.splash.fact.45=Lançado em 1988, «Banzai Run» é uma máquina única com tema de motocross e um campo de jogo vertical no backglass controlado por ímãs.
studio.splash.fact.46=A máquina «Earthshaker» de 1989 tinha um motor vibrador simulando um terremoto durante o jogo.
studio.splash.fact.47=A máquina «Funhouse» da Williams em 1990 apresentava uma cabeça animatrônica falante chamada Rudy.
studio.splash.fact.48=A máquina «Exterminador do Futuro 2: O Julgamento Final» de 1991 apresentava um display de vídeo, fundindo elementos digitais e físicos.
studio.splash.fact.49=A máquina «A Família Addams» de 1992 tornou-se um dos jogos de pinball mais vendidos de todos os tempos.
studio.splash.fact.50=A máquina «Twilight Zone» de 1993 é conhecida por seu gameplay complexo e recursos inovadores.
studio.splash.fact.51=A máquina «World Cup Soccer» de 1994 coincidiu com a Copa do Mundo da FIFA e apresentou gameplay com tema futebolístico.
studio.splash.fact.52=A máquina «Attack from Mars» de 1995 é muito apreciada por seu humor e design inovador.
studio.splash.fact.53=O Pinball 2000, introduzido em 1999, combinou o pinball tradicional com gráficos de vídeo gerados por computador.
studio.splash.fact.54=«Revenge from Mars» da Bally em 1999 foi a primeira máquina a usar a plataforma Pinball 2000, com display holográfico que sobrepunha alvos animados ao campo de jogo.
studio.splash.fact.55=As máquinas de pinball são conhecidas por suas intrincadas artes e design, frequentemente criados por artistas renomados como Dave Christensen e Greg Freres.
studio.splash.fact.56=A máquina «Tron: Legacy» da Stern em 2010 incorporou temas do filme.
studio.splash.fact.57=A maior pontuação registrada em uma máquina de pinball é de mais de 2,8 bilhões de pontos, conquistada na máquina «A Família Addams» por Billy Maze em 2011.
studio.splash.fact.58=A International Flipper Pinball Association (IFPA) foi fundada em 2006 para promover o pinball competitivo.
studio.splash.fact.59=A máquina «O Mágico de Oz» de 2013 apresenta uma ampla tela LCD como display principal.
studio.splash.fact.60=A máquina «Ghostbusters» da Stern em 2015 presta homenagem à popular franquia cinematográfica.
studio.splash.fact.61=A máquina «Dialed In!» da Jersey Jack Pinball em 2016 apresenta conectividade Bluetooth e integração com smartphone.
studio.splash.fact.62=Apesar do surgimento dos videogames, o pinball perdurou como passatempo querido, com novas máquinas e tecnologias continuando a cativar jogadores de todas as idades.
