pref.discord_faq.once_your_discord_bot_is_configured_correctly_you_if_you_want=Depois de o seu bot do Discord estar corretamente configurado, pode iniciar uma nova competição online na secção "Competitions". Se quiser que outros proprietários de VPin se juntem à sua competição, ou se quiser juntar-se à deles, troquem entre si o URL OAuth2 da interface da aplicação do Discord (ver "How To: Create a Discord Bot", secção 4). O administrador do servidor do Discord pode executar o URL e adicionar os bots do VPin ao servidor, para que eles ou você possam juntar-se a uma competição.
pref.discord_faq.since_the_highscore_initials_are_only_three_characters_so_it=Uma vez que as iniciais do highscore têm apenas três caracteres, cada utilizador tem de adaptar a sua alcunha no servidor configurado, para que possa ser correspondida com um highscore. As iniciais devem fazer parte da alcunha, separadas pelo símbolo de barra vertical "|" e entre parênteses retos, por exemplo, "My Nickname | [ABC]".
