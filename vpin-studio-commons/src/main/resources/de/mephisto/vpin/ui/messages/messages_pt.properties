pref.discord_faq.invoke_the_context_menu_on_your_username_in_update_the_nickname=Invoque o menu de contexto no seu nome de utilizador na lista de membros. Clique em "Edit Server Profile", atualize a alcunha e guarde as alterações. O nome só é alterado para esse servidor específico.
