studio.splash.fact.1=Le premier jeu connu ressemblant au flipper, la « Bagatelle », est apparu en France au XVIIIe siècle.
studio.splash.fact.2=La Bagatelle fut introduite aux États-Unis au XIXe siècle, où elle évolua en un jeu de salon populaire.
studio.splash.fact.3=Le jeu de type flipper fut créé par Montague Redgrave en 1871. Il breveta un lanceur à ressort pour projeter la bille, une caractéristique encore utilisée aujourd'hui.
studio.splash.fact.4=Le nom du jeu évolua de « Bagatelle » à « table à billes » puis à « flipper » suite à l'ajout de petites chevilles sur la surface de jeu.
studio.splash.fact.5=La première machine à flipper à pièces, le Ballyhoo, fut créée en 1931 par Raymond Maloney.
studio.splash.fact.6=À ses débuts, les machines à flipper étaient considérées comme des jeux de hasard et souvent associées aux jeux d'argent.
studio.splash.fact.7=Dans les années 1930 et 1940, Gottlieb & Co. joua un rôle déterminant dans le développement des premières machines à flipper, en introduisant des innovations comme les pop-bumpers et les palettes.
studio.splash.fact.8=En 1932, Baffle Ball était une machine à flipper populaire proposant dix billes pour un centime. Ce fut l'une des premières à connaître un succès généralisé.
studio.splash.fact.9=La machine à flipper « Contact » de 1933 fut la première à disposer de fonctions alimentées électriquement.
studio.splash.fact.10=La première machine à flipper équipée d'un mécanisme anti-triche empêchant les secousses excessives fut introduite en 1934.
studio.splash.fact.11=Le tournoi Big Whiffle de 1935 fut la première compétition officielle de flipper, ouvrant la voie aux événements organisés qui se poursuivent encore aujourd'hui.
studio.splash.fact.12=La machine à flipper « Bumper » de 1936 marqua l'introduction des premiers pop-bumpers sur le plateau de jeu.
studio.splash.fact.13=Les machines à flipper furent interdites dans les grandes villes comme New York et Los Angeles dans les années 1940 en raison de craintes liées aux jeux d'argent.
studio.splash.fact.14=La machine à flipper « Humpty Dumpty » de Gottlieb en 1947 introduisit les premières palettes actionnables, transformant radicalement le gameplay.
studio.splash.fact.15=La machine à flipper « Triple Action » de 1948 fut la première à inclure trois palettes sur le plateau.
studio.splash.fact.16=L'introduction des palettes accrut le contrôle du joueur, réduisant la part de hasard et rendant le flipper plus basé sur la compétence.
studio.splash.fact.17=Les années 1950 virent l'essor des machines à flipper comme divertissement, entraînant la levée de nombreuses interdictions.
studio.splash.fact.18=Dans les années 1950, des composants électromécaniques tels que des relais et des unités à pas commencèrent à être intégrés dans les machines, ajoutant complexité et nouvelles fonctionnalités de jeu.
studio.splash.fact.19=Dans les années 1950, les machines à flipper commencèrent à adopter des thèmes inspirés de la culture populaire, du cinéma et de la télévision.
studio.splash.fact.20=La machine à flipper « Spot Bowler » de 1950 présentait un mini-bowling sur le plateau de jeu.
studio.splash.fact.21=La machine « Super Jumbo » de Williams en 1954 fut la première à disposer d'un caisson extra-large.
studio.splash.fact.22=La machine « Magic Clock » de Williams en 1960 affichait un cadran d'horloge avec des aiguilles sur la backglass.
studio.splash.fact.23=La machine « Gottlieb Slick Chick » de 1963 introduisit des palettes à fermeture éclair, permettant aux joueurs de contrôler le mouvement de la bille.
studio.splash.fact.24=La machine « Bank-A-Ball » de Gottlieb en 1965 introduisit la première fonctionnalité multiball.
studio.splash.fact.25=En 1966, la machine à flipper « Batman » devint le premier jeu de flipper sous licence, mettant en scène des personnages de la populaire série télévisée.
studio.splash.fact.26=Le flipper connut une immense popularité dans les années 1970 et 1980, devenant incontournable dans les salles d'arcade aux côtés des jeux vidéo.
studio.splash.fact.27=La transition vers les machines à flipper numériques débuta à la fin des années 1970, avec l'introduction de l'électronique à état solide, des affichages numériques et d'effets sonores améliorés.
studio.splash.fact.28=Les machines à flipper thématiques, mettant en scène des références culturelles, des films et des émissions de télévision, commencèrent à apparaître dans les années 1970, renforçant leur attrait et leur valeur de collection.
studio.splash.fact.29=La machine « Spirit of 76 » de Micro Games en 1970 célébrait le bicentenaire des États-Unis.
studio.splash.fact.30=Les années 1970 virent l'avènement de composants électroniques remplaçant de nombreuses pièces mécaniques dans les machines à flipper.
studio.splash.fact.31=La machine « Spanish Eyes » de Williams en 1970 fut l'une des premières à disposer de cibles rabattables.
studio.splash.fact.32=La machine « Challenger » de Gottlieb en 1971 permettait une compétition en face-à-face grâce à un plateau double, deux jeux de palettes et une double backglass.
studio.splash.fact.33=« Fireball » de Bally, sorti en 1972, fut l'une des premières machines à flipper à inclure un boîtier vocal mécanique émettant des sons.
studio.splash.fact.34=L'opéra rock « Tommy » des Who mettait en scène un personnage de génie du flipper, boostant la popularité du jeu dans les années 1970.
studio.splash.fact.35=La machine « Spirit of 76 » de 1975 présentait une cible rotative simulant le mouvement d'une roulette.
studio.splash.fact.36=La machine « Captain Fantastic » de 1976 proposait des illustrations inspirées du musicien Elton John.
studio.splash.fact.37=La machine « Fireball » de Bally en 1977 présentait un disque rotatif au centre du plateau de jeu.
studio.splash.fact.38=La machine « Gorgar » de 1979 fut la première à proposer une synthèse vocale, prononçant de simples phrases durant la partie.
studio.splash.fact.39=Le jeu « Black Knight » de Williams en 1979 introduisit le premier plateau de jeu multi-niveaux, ajoutant profondeur et complexité au gameplay.
studio.splash.fact.40=Les années 1980 virent un déclin de la popularité du flipper en raison de l'essor des jeux vidéo.
studio.splash.fact.41=La machine « Black Knight » de Williams en 1980 présentait un bouton Magna-Save permettant aux joueurs de sauver une bille perdue.
studio.splash.fact.42=Sortie par Gottlieb en 1982, « Haunted House » est célèbre pour ses huit palettes et un sous-niveau caché.
studio.splash.fact.43=La machine « Firepower II » de 1984 fut la première à utiliser un affichage alphanumérique.
studio.splash.fact.44=La machine « High Speed » de Williams en 1986 fut la première à utiliser des affichages alphanumériques pour le score.
studio.splash.fact.45=Sorti en 1988, « Banzai Run » est une machine unique avec un thème motocross et un plateau de jeu vertical sur la backglass contrôlé par des aimants.
studio.splash.fact.46=La machine « Earthshaker » de 1989 disposait d'un moteur vibrant simulant un tremblement de terre durant la partie.
studio.splash.fact.47=La machine « Funhouse » de Williams en 1990 présentait une tête animatronique parlante nommée Rudy.
studio.splash.fact.48=La machine « Terminator 2 : Le Jugement dernier » de 1991 disposait d'un écran vidéo, fusionnant éléments numériques et physiques.
studio.splash.fact.49=La machine « La Famille Addams » de 1992 devint l'un des jeux de flipper les plus vendus de tous les temps.
studio.splash.fact.50=La machine « Twilight Zone » de 1993 est connue pour son gameplay complexe et ses fonctionnalités innovantes.
studio.splash.fact.51=La machine « World Cup Soccer » de 1994 coïncida avec la Coupe du Monde de la FIFA et proposa un gameplay sur le thème du football.
studio.splash.fact.52=La machine « Attack from Mars » de 1995 est très appréciée pour son humour et son design innovant.
studio.splash.fact.53=Pinball 2000, introduit en 1999, combina le flipper traditionnel avec des graphismes vidéo générés par ordinateur.
studio.splash.fact.54=« Revenge from Mars » de Bally en 1999 fut la première machine à utiliser la plateforme Pinball 2000, avec un affichage holographique superposant des cibles animées sur le plateau.
studio.splash.fact.55=Les machines à flipper sont réputées pour leurs illustrations et leur design élaborés, souvent créés par des artistes renommés comme Dave Christensen et Greg Freres.
studio.splash.fact.56=La machine « Tron : Legacy » de Stern en 2010 incorpora les thèmes du film.
studio.splash.fact.57=Le score le plus élevé jamais enregistré sur une machine à flipper dépasse 2,8 milliards de points, réalisé sur la machine « La Famille Addams » par Billy Maze en 2011.
studio.splash.fact.58=L'International Flipper Pinball Association (IFPA) fut fondée en 2006 pour promouvoir le flipper compétitif.
studio.splash.fact.59=La machine « Le Magicien d'Oz » de 2013 dispose d'un large écran LCD comme affichage principal.
studio.splash.fact.60=La machine « Ghostbusters » de Stern en 2015 rend hommage à la célèbre franchise cinématographique.
studio.splash.fact.61=La machine « Dialed In ! » de Jersey Jack Pinball en 2016 propose une connectivité Bluetooth et une intégration smartphone.
studio.splash.fact.62=Malgré l'essor des jeux vidéo, le flipper a perduré comme passe-temps bien-aimé, avec de nouvelles machines et technologies qui continuent de captiver les joueurs de tous âges.
