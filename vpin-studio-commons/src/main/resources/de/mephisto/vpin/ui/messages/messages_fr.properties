pref.discord_faq.once_your_discord_bot_is_configured_correctly_you_if_you_want=Une fois votre bot Discord correctement configuré, vous pouvez démarrer une nouvelle compétition en ligne dans la section "Compétitions". Si vous souhaitez que d'autres propriétaires de VPin rejoignent votre compétition, ou si vous souhaitez rejoindre la leur, échangez l'URL OAuth2 depuis l'interface de l'application Discord (voir "Comment faire : Créer un bot Discord", section 4). L'administrateur du serveur Discord peut exécuter l'URL et ajouter les bots VPin au serveur, afin que vous ou eux puissiez rejoindre une compétition.
pref.discord_faq.since_the_highscore_initials_are_only_three_characters_so_it=Étant donné que les initiales des highscores ne comportent que trois caractères, chaque utilisateur doit adapter son pseudonyme sur le serveur configuré afin qu'il puisse être associé à un highscore. Les initiales doivent faire partie du pseudonyme, séparées par le symbole barre verticale "|" et placées entre crochets, par exemple "My Nickname | [ABC]".
pref.discord_faq.the_faq_should_help_you_setting_up_a=Cette FAQ devrait vous aider à configurer un bot Discord et à le connecter à votre VPin.
pref.discord_faq.when_you_open_the_players_section_you_should_ask_them=Lorsque vous ouvrez la section "Joueurs", un avertissement s'affiche si deux joueurs ont les mêmes initiales. Demandez-leur de changer leur pseudonyme, ou utilisez vos droits d'administrateur pour le faire à leur place.
