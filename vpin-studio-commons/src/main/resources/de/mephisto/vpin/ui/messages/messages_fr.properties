pref.discord_faq.invoke_the_context_menu_on_your_username_in_update_the_nickname=Ouvrez le menu contextuel sur votre nom d'utilisateur dans la liste des membres. Cliquez sur "Modifier le profil du serveur", mettez à jour le pseudonyme et enregistrez les modifications. Le nom n'est modifié que pour ce serveur spécifique.
