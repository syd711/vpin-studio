pref.discord_faq.no_worries_discord_allows_to_assign_you_a=No worries! Discord allows to assign you a different name for every server. 
pref.discord_faq.once_your_discord_bot_is_configured_correctly_you_if_you_want=Once your Discord bot is configured correctly, you can start a new online competition in the "Competitions" section. If you want your other VPin owners to join your competition or you want to join theirs, exchange the OAuth2 URL from the Discord application interface with them (see "How To: Create a Discord Bot", section 4). The administrator of the Discord server can execute the URL and add the VPin bots to the server, so that they or you can join a competition.
pref.discord_faq.since_the_highscore_initials_are_only_three_characters_so_it=Since the highscore initials are only three characters long, every user has adapt their nickname on the configured server, so it can be matched against a highscore. The initials must be part of the nickname, separated by the pipe symbol "|" and within  square brackets, e.g "My Nickname | [ABC]".
pref.discord_faq.the_faq_should_help_you_setting_up_a=The FAQ should help you setting up a Discord bot and connect it to your VPin.
pref.discord_faq.when_you_open_the_players_section_you_should_ask_them=When you open the "Players" section, you should see a warning when two players have the same initials. Ask them to change their nickname or use your administrator-rights to change it for them.
