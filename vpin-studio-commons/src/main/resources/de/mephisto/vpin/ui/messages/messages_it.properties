pref.discord_faq.when_you_open_the_players_section_you_should_ask_them=Quando apri la sezione "Players", dovresti vedere un avviso se due giocatori hanno le stesse iniziali. Chiedi loro di cambiare il nickname oppure utilizza i tuoi diritti di amministratore per cambiarlo al posto loro.
