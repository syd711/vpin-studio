pref.discord_faq.once_your_discord_bot_is_configured_correctly_you_if_you_want=Una volta che il tuo bot Discord è configurato correttamente, puoi avviare una nuova competizione online nella sezione "Competitions". Se vuoi che altri proprietari di VPin partecipino alla tua competizione o vuoi partecipare alla loro, scambia con loro l'URL OAuth2 dall'interfaccia dell'applicazione Discord (vedi "Come Fare: Creare un Bot Discord", sezione 4). L'amministratore del server Discord può eseguire l'URL e aggiungere i bot VPin al server, in modo che loro o tu possiate partecipare a una competizione.
pref.discord_faq.since_the_highscore_initials_are_only_three_characters_so_it=Poiché le iniziali degli highscore sono lunghe solo tre caratteri, ogni utente deve adattare il proprio nickname sul server configurato, in modo che possa essere associato a un highscore. Le iniziali devono far parte del nickname, separate dal simbolo pipe "|" e racchiuse tra parentesi quadre, ad es. "My Nickname | [ABC]".
