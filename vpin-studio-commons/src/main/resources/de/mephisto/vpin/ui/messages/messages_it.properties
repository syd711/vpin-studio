studio.splash.fact.1=Il primo gioco noto simile al flipper, la «Bagatella», ebbe origine in Francia nel XVIII secolo.
studio.splash.fact.2=La Bagatella fu introdotta negli Stati Uniti nel XIX secolo, dove evolse in un popolare gioco da salotto.
studio.splash.fact.3=Il gioco simile al flipper fu creato da Montague Redgrave nel 1871. Brevettò un lanciatore a molla per lanciare la biglia, una caratteristica ancora in uso oggi.
studio.splash.fact.4=Il nome del gioco si evolse da «Bagatella» a «tavolo delle biglie» e infine «flipper» grazie all'aggiunta di perni sulla superficie di gioco.
studio.splash.fact.5=La prima macchina da flipper a monete, il Ballyhoo, fu creata nel 1931 da Raymond Maloney.
studio.splash.fact.6=Agli albori, le macchine da flipper erano considerate giochi d'azzardo e molte erano associate al gioco d'azzardo.
studio.splash.fact.7=Negli anni '30 e '40, Gottlieb & Co. fu fondamentale nello sviluppo delle prime macchine da flipper, introducendo innovazioni come i pop bumper e le palette.
studio.splash.fact.8=Nel 1932, il Baffle Ball era una popolare macchina da flipper che offriva dieci biglie per un centesimo. Fu una delle prime a raggiungere un successo diffuso.
studio.splash.fact.9=La macchina da flipper «Contact» del 1933 fu la prima ad avere funzioni alimentate elettricamente.
studio.splash.fact.10=La prima macchina da flipper con un meccanismo di inclinazione per impedire ai giocatori di scosse eccessive fu introdotta nel 1934.
studio.splash.fact.11=Il torneo Big Whiffle del 1935 fu la prima competizione ufficiale di flipper, aprendo la strada agli eventi organizzati che continuano ancora oggi.
studio.splash.fact.12=La macchina da flipper «Bumper» del 1936 segnò l'introduzione dei primi pop bumper sul piano di gioco.
studio.splash.fact.13=Le macchine da flipper furono vietate nelle grandi città come New York e Los Angeles negli anni '40 a causa di preoccupazioni legate al gioco d'azzardo.
studio.splash.fact.14=La macchina da flipper «Humpty Dumpty» di Gottlieb nel 1947 introdusse i primi pulsanti delle palette, cambiando le dinamiche di gioco.
studio.splash.fact.15=La macchina da flipper «Triple Action» del 1948 fu la prima a includere tre palette sul piano di gioco.
studio.splash.fact.16=L'introduzione delle palette aumentò il controllo del giocatore, riducendo l'elemento di fortuna e rendendo il flipper più basato sulle abilità.
studio.splash.fact.17=Gli anni '50 videro il boom delle macchine da flipper come forma di intrattenimento, portando alla revoca di molti divieti.
studio.splash.fact.18=Negli anni '50, componenti elettromeccanici, come relè e unità passo-passo, iniziarono a essere integrati nelle macchine da flipper, aggiungendo complessità e nuove funzionalità di gioco.
studio.splash.fact.19=Negli anni '50, le macchine da flipper iniziarono a presentare temi basati sulla cultura popolare, film e programmi televisivi.
studio.splash.fact.20=La macchina da flipper «Spot Bowler» del 1950 presentava un mini-bowling sul piano di gioco.
studio.splash.fact.21=La macchina «Super Jumbo» di Williams nel 1954 fu la prima ad avere un cabinet extra-largo.
studio.splash.fact.22=La macchina «Magic Clock» di Williams nel 1960 presentava un quadrante di orologio con lancette sul backglass.
studio.splash.fact.23=La macchina «Gottlieb Slick Chick» del 1963 presentava palette a cerniera, permettendo ai giocatori di controllare il movimento della biglia.
studio.splash.fact.24=La macchina «Bank-A-Ball» di Gottlieb nel 1965 introdusse la prima funzione multiball.
studio.splash.fact.25=Nel 1966, la macchina da flipper «Batman» divenne il primo gioco da flipper con licenza, con personaggi della popolare serie televisiva.
studio.splash.fact.26=Il flipper guadagnò un'immensa popolarità negli anni '70 e '80, diventando un punto fermo nelle sale giochi accanto ai videogiochi.
studio.splash.fact.27=La transizione verso le macchine da flipper digitali iniziò alla fine degli anni '70, con l'introduzione dell'elettronica a stato solido, display digitali ed effetti sonori migliorati.
studio.splash.fact.28=Le macchine da flipper tematiche, con riferimenti alla cultura popolare, film e programmi televisivi, iniziarono ad apparire negli anni '70, aumentandone il fascino e la collezionabilità.
studio.splash.fact.29=La macchina «Spirit of 76» di Micro Games nel 1970 celebrava il bicentenario degli Stati Uniti.
studio.splash.fact.30=Gli anni '70 videro l'avvento di componenti elettronici che sostituirono molte parti meccaniche nelle macchine da flipper.
studio.splash.fact.31=La macchina «Spanish Eyes» di Williams nel 1970 fu una delle prime a presentare bersagli abbattibili.
studio.splash.fact.32=La macchina «Challenger» di Gottlieb nel 1971 permetteva la competizione testa a testa con un piano di gioco doppio, due set di palette e backglass.
studio.splash.fact.33=«Fireball» di Bally, uscito nel 1972, fu una delle prime macchine da flipper a includere una scatola vocale meccanica che emetteva suoni.
studio.splash.fact.34=L'opera rock «Tommy» degli Who presentava un personaggio che era un mago del flipper, aumentando la popolarità del gioco negli anni '70.
studio.splash.fact.35=La macchina «Spirit of 76» del 1975 presentava un bersaglio rotante che simulava il movimento di una ruota della roulette.
studio.splash.fact.36=La macchina «Captain Fantastic» del 1976 presentava illustrazioni ispirate al musicista Elton John.
studio.splash.fact.37=La macchina «Fireball» di Bally nel 1977 presentava un disco rotante al centro del piano di gioco.
studio.splash.fact.38=La macchina da flipper «Gorgar» del 1979 fu la prima a presentare voce sintetizzata, pronunciando semplici frasi durante il gioco.
studio.splash.fact.39=Il gioco «Black Knight» di Williams nel 1979 introdusse il primo piano di gioco multilivello, aggiungendo profondità e complessità al gameplay.
studio.splash.fact.40=Gli anni '80 videro un declino nella popolarità del flipper a causa del boom dei videogiochi.
studio.splash.fact.41=La macchina «Black Knight» di Williams nel 1980 presentava un pulsante Magna-Save che permetteva ai giocatori di salvare una biglia persa.
studio.splash.fact.42=Pubblicata da Gottlieb nel 1982, «Haunted House» è famosa per le sue otto palette e un sottolivello nascosto.
studio.splash.fact.43=La macchina «Firepower II» del 1984 fu la prima a utilizzare un display alfanumerico.
studio.splash.fact.44=La macchina «High Speed» di Williams nel 1986 fu la prima a usare display alfanumerici per il punteggio.
studio.splash.fact.45=Uscito nel 1988, «Banzai Run» è una macchina unica con tema motocross e un piano di gioco verticale sul backglass controllato da magneti.
studio.splash.fact.46=La macchina «Earthshaker» del 1989 aveva un motore vibrante che simulava un terremoto durante il gioco.
studio.splash.fact.47=La macchina «Funhouse» di Williams nel 1990 presentava una testa animatronica parlante di nome Rudy.
studio.splash.fact.48=La macchina «Terminator 2: Il Giorno del Giudizio» del 1991 presentava un display video, fondendo elementi digitali e fisici.
studio.splash.fact.49=La macchina «La Famiglia Addams» del 1992 divenne uno dei giochi da flipper più venduti di tutti i tempi.
studio.splash.fact.50=La macchina «Twilight Zone» del 1993 è nota per il suo gameplay complesso e le sue funzionalità innovative.
studio.splash.fact.51=La macchina «World Cup Soccer» del 1994 coincise con la Coppa del Mondo FIFA e presentò un gameplay a tema calcistico.
studio.splash.fact.52=La macchina «Attack from Mars» del 1995 è molto apprezzata per il suo umorismo e il design innovativo.
studio.splash.fact.53=Il Pinball 2000, introdotto nel 1999, combinò il flipper tradizionale con grafica video generata al computer.
studio.splash.fact.54=«Revenge from Mars» di Bally nel 1999 fu la prima macchina a usare la piattaforma Pinball 2000, con un display olografico che sovrapponeva bersagli animati al piano di gioco.
studio.splash.fact.55=Le macchine da flipper sono note per le loro intricate illustrazioni e design, spesso creati da artisti rinomati come Dave Christensen e Greg Freres.
studio.splash.fact.56=La macchina «Tron: Legacy» di Stern nel 2010 incorporò i temi del film.
studio.splash.fact.57=Il punteggio più alto mai registrato su una macchina da flipper supera i 2,8 miliardi di punti, ottenuto sulla macchina «La Famiglia Addams» da Billy Maze nel 2011.
studio.splash.fact.58=La International Flipper Pinball Association (IFPA) fu fondata nel 2006 per promuovere il flipper competitivo.
studio.splash.fact.59=La macchina «Il Mago di Oz» del 2013 presenta un ampio schermo LCD come display principale.
studio.splash.fact.60=La macchina «Ghostbusters» di Stern nel 2015 rende omaggio alla popolare franchise cinematografica.
studio.splash.fact.61=La macchina «Dialed In!» di Jersey Jack Pinball nel 2016 presenta connettività Bluetooth e integrazione con smartphone.
studio.splash.fact.62=Nonostante il boom dei videogiochi, il flipper è sopravvissuto come amato passatempo, con nuove macchine e tecnologie che continuano ad affascinare giocatori di tutte le età.
