pref.discord_faq.invoke_the_context_menu_on_your_username_in_update_the_nickname=Richiama il menu contestuale sul tuo nome utente nell'elenco dei membri. Fai clic su "Edit Server Profile", aggiorna il nickname e salva le modifiche. Il nome viene modificato solo per quel server specifico.
