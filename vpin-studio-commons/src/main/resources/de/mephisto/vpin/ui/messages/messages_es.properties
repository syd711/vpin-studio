pref.discord_faq.once_your_discord_bot_is_configured_correctly_you_if_you_want=Una vez que su bot de Discord esté configurado correctamente, puede iniciar una nueva competición en línea en la sección "Competitions". Si desea que otros propietarios de VPin se unan a su competición o desea unirse a la de ellos, intercambien la URL de OAuth2 de la interfaz de la aplicación de Discord (consulte "How To: Create a Discord Bot", sección 4). El administrador del servidor de Discord puede ejecutar la URL y añadir los bots de VPin al servidor, para que ellos o usted puedan unirse a una competición.
pref.discord_faq.since_the_highscore_initials_are_only_three_characters_so_it=Dado que las iniciales del highscore tienen solo tres caracteres, cada usuario debe adaptar su apodo en el servidor configurado para que pueda compararse con un highscore. Las iniciales deben formar parte del apodo, separadas por el símbolo de barra vertical "|" y entre corchetes, p. ej. "My Nickname | [ABC]".
