studio.splash.fact.1=El primer juego conocido similar al pinball, la «Bagatela», se originó en Francia en el siglo XVIII.
studio.splash.fact.2=La Bagatela fue introducida en los Estados Unidos en el siglo XIX, donde evolucionó hasta convertirse en un popular juego de salón.
studio.splash.fact.3=El juego similar al pinball fue creado por Montague Redgrave en 1871. Patentó un lanzador de muelle para impulsar la bola, una característica que se sigue utilizando hoy en día.
studio.splash.fact.4=El nombre del juego evolucionó de «Bagatela» a «mesa de canicas» y finalmente «pinball» debido a la adición de pines en la superficie de juego.
studio.splash.fact.5=La máquina de pinball con monedas, Ballyhoo, fue creada en 1931 por Raymond Maloney.
studio.splash.fact.6=En sus inicios, las máquinas de pinball se consideraban juegos de azar y muchas estaban asociadas con el juego.
studio.splash.fact.7=En las décadas de 1930 y 1940, Gottlieb & Co. fue fundamental en el desarrollo de las primeras máquinas de pinball, introduciendo innovaciones como los pop bumpers y las aletas.
studio.splash.fact.8=En 1932, Baffle Ball era una popular máquina de pinball que ofrecía diez bolas por un centavo. Fue una de las primeras en lograr un éxito generalizado.
studio.splash.fact.9=La máquina de pinball «Contact» de 1933 fue la primera en tener funciones eléctricas.
studio.splash.fact.10=La primera máquina de pinball con un mecanismo de inclinación para evitar que los jugadores la sacudieran excesivamente se introdujo en 1934.
studio.splash.fact.11=El torneo Big Whiffle de 1935 fue la primera competición oficial de pinball, sentando las bases para los eventos organizados que continúan hasta hoy.
studio.splash.fact.12=La máquina de pinball «Bumper» de 1936 marcó la introducción de los primeros pop bumpers en el campo de juego.
studio.splash.fact.13=Las máquinas de pinball fueron prohibidas en grandes ciudades como Nueva York y Los Ángeles en la década de 1940 debido a preocupaciones sobre el juego.
studio.splash.fact.14=La máquina de pinball «Humpty Dumpty» de Gottlieb en 1947 introdujo los primeros botones de aleta, cambiando la dinámica del juego.
studio.splash.fact.15=La máquina de pinball «Triple Action» de 1948 fue la primera en incluir tres aletas en el campo de juego.
studio.splash.fact.16=La introducción de las aletas aumentó el control del jugador, reduciendo el elemento de azar y haciendo el pinball más basado en la habilidad.
studio.splash.fact.17=La década de 1950 vio el auge de las máquinas de pinball como forma de entretenimiento, llevando a la eliminación de muchas prohibiciones.
studio.splash.fact.18=En la década de 1950, los componentes electromecánicos, como relés y unidades de paso, comenzaron a integrarse en las máquinas de pinball, añadiendo complejidad y nuevas funciones de juego.
studio.splash.fact.19=En la década de 1950, las máquinas de pinball comenzaron a presentar temáticas basadas en la cultura popular, el cine y la televisión.
studio.splash.fact.20=La máquina de pinball «Spot Bowler» de 1950 presentaba una mini-bolera en el campo de juego.
studio.splash.fact.21=La máquina «Super Jumbo» de Williams en 1954 fue la primera en tener un cuerpo extraancho.
studio.splash.fact.22=La máquina «Magic Clock» de Williams en 1960 presentaba una esfera de reloj con manecillas en el backglass.
studio.splash.fact.23=La máquina «Gottlieb Slick Chick» de 1963 presentaba aletas de cremallera, permitiendo a los jugadores controlar el movimiento de la bola.
studio.splash.fact.24=La máquina «Bank-A-Ball» de Gottlieb en 1965 introdujo la primera función multiball.
studio.splash.fact.25=En 1966, la máquina de pinball «Batman» se convirtió en el primer juego de pinball con licencia, con personajes de la popular serie de televisión.
studio.splash.fact.26=El pinball ganó una inmensa popularidad en las décadas de 1970 y 1980, convirtiéndose en un elemento indispensable en las salas de juego junto a los videojuegos.
studio.splash.fact.27=La transición a las máquinas de pinball digitales comenzó a finales de la década de 1970, con la introducción de la electrónica de estado sólido, pantallas digitales y efectos de sonido mejorados.
studio.splash.fact.28=Las máquinas de pinball temáticas, con referencias a la cultura popular, películas y series de televisión, comenzaron a aparecer en la década de 1970, aumentando su atractivo y coleccionabilidad.
studio.splash.fact.29=La máquina «Spirit of 76» de Micro Games en 1970 celebraba el bicentenario de los Estados Unidos.
studio.splash.fact.30=La década de 1970 vio la llegada de componentes electrónicos que reemplazaron muchas piezas mecánicas en las máquinas de pinball.
studio.splash.fact.31=La máquina «Spanish Eyes» de Williams en 1970 fue una de las primeras en presentar dianas abatibles.
studio.splash.fact.32=La máquina «Challenger» de Gottlieb en 1971 permitía la competición cara a cara con un campo de juego doble, dos juegos de aletas y backglass.
studio.splash.fact.33=«Fireball» de Bally, lanzado en 1972, fue una de las primeras máquinas de pinball en incluir una caja de voz mecánica que emitía sonidos.
studio.splash.fact.34=La ópera rock «Tommy» de The Who presentaba un personaje que era un mago del pinball, impulsando la popularidad del juego en la década de 1970.
studio.splash.fact.35=La máquina «Spirit of 76» de 1975 presentaba una diana giratoria que simulaba el movimiento de una ruleta.
studio.splash.fact.36=La máquina «Captain Fantastic» de 1976 presentaba ilustraciones inspiradas en el músico Elton John.
studio.splash.fact.37=La máquina «Fireball» de Bally en 1977 presentaba un disco giratorio en el centro del campo de juego.
studio.splash.fact.38=La máquina de pinball «Gorgar» de 1979 fue la primera en presentar voz sintetizada, pronunciando frases simples durante el juego.
studio.splash.fact.39=El juego «Black Knight» de Williams en 1979 introdujo el primer campo de juego multinivel, añadiendo profundidad y complejidad al gameplay.
studio.splash.fact.40=La década de 1980 vio un declive en la popularidad del pinball debido al auge de los videojuegos.
studio.splash.fact.41=La máquina «Black Knight» de Williams en 1980 presentaba un botón Magna-Save que permitía a los jugadores salvar una bola perdida.
studio.splash.fact.42=Lanzada por Gottlieb en 1982, «Haunted House» es famosa por sus ocho aletas y un subnivel oculto.
studio.splash.fact.43=La máquina «Firepower II» de 1984 fue la primera en utilizar pantalla alfanumérica.
studio.splash.fact.44=La máquina «High Speed» de Williams en 1986 fue la primera en usar pantallas alfanuméricas para la puntuación.
studio.splash.fact.45=Lanzado en 1988, «Banzai Run» es una máquina única con temática de motocross y un campo de juego vertical en el backglass controlado por imanes.
studio.splash.fact.46=La máquina «Earthshaker» de 1989 tenía un motor vibrador que simulaba un terremoto durante el juego.
studio.splash.fact.47=La máquina «Funhouse» de Williams en 1990 presentaba una cabeza animatrónica parlante llamada Rudy.
studio.splash.fact.48=La máquina «Terminator 2: El Juicio Final» de 1991 presentaba una pantalla de vídeo que fusionaba elementos digitales y físicos.
studio.splash.fact.49=La máquina «Los Locos Addams» de 1992 se convirtió en uno de los juegos de pinball más vendidos de todos los tiempos.
studio.splash.fact.50=La máquina «Twilight Zone» de 1993 es conocida por su complejo gameplay y sus innovadoras funciones.
studio.splash.fact.51=La máquina «World Cup Soccer» de 1994 coincidió con la Copa del Mundo de la FIFA y presentó un gameplay con temática futbolística.
studio.splash.fact.52=La máquina «Attack from Mars» de 1995 es muy valorada por su humor y su diseño innovador.
studio.splash.fact.53=Pinball 2000, introducido en 1999, combinó el pinball tradicional con gráficos de vídeo generados por ordenador.
studio.splash.fact.54=«Revenge from Mars» de Bally en 1999 fue la primera máquina en utilizar la plataforma Pinball 2000, con una pantalla holográfica que superponía dianas animadas sobre el campo de juego.
studio.splash.fact.55=Las máquinas de pinball son conocidas por sus elaboradas ilustraciones y diseño, a menudo creados por artistas de renombre como Dave Christensen y Greg Freres.
studio.splash.fact.56=La máquina «Tron: Legacy» de Stern en 2010 incorporó los temas de la película.
studio.splash.fact.57=La puntuación más alta registrada en una máquina de pinball es de más de 2.800 millones de puntos, lograda en la máquina «Los Locos Addams» por Billy Maze en 2011.
studio.splash.fact.58=La International Flipper Pinball Association (IFPA) fue fundada en 2006 para promover el pinball competitivo.
studio.splash.fact.59=La máquina «El Mago de Oz» de 2013 presenta una amplia pantalla LCD como pantalla principal.
studio.splash.fact.60=La máquina «Ghostbusters» de Stern en 2015 rinde homenaje a la popular franquicia cinematográfica.
studio.splash.fact.61=La máquina «Dialed In!» de Jersey Jack Pinball en 2016 presenta conectividad Bluetooth e integración con smartphone.
studio.splash.fact.62=A pesar del auge de los videojuegos, el pinball ha perdurado como pasatiempo querido, con nuevas máquinas y tecnologías que siguen cautivando a jugadores de todas las edades.
