# Example resources/system.properties for a Linux cabinet running standalone VPX 10.8.1,
# with one folder per table (see LINUX-SERVER.md).

# The folder of the VPX build
visualPinball.installationDir=/home/pinball/vpx/builds/5436
# Optional: the program to launch tables with, e.g. a wrapper script taking VPX's arguments.
# Defaults to VPinballX_BGFX, VPinballX_GL or VPinballX in the installation folder.
visualPinball.executable=/home/pinball/bin/vpx-launch.sh
# Optional: defaults to the newest ~/.local/share/VPinballX/<version>/VPinballX.ini
visualPinball.configFile=/home/pinball/.local/share/VPinballX/10.8/VPinballX.ini
# Optional: defaults to <installationDir>/Tables
visualPinball.tablesFolder=/home/pinball/tables

# Features that are off by default on Linux can be switched back on:
#system.featuresOn=HIGHSCORE_MONITORING
