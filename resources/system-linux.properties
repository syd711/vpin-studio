# The server on Linux always reads this file instead of system.properties, so edit it in place -
# there is nothing to copy or rename. Example for a Linux cabinet running standalone VPX 10.8.1,
# with one folder per table (see LINUX-SERVER.md).

# The folder of the VPX build
visualPinball.installationDir=/home/mfaust/vpx
# Optional: the program to launch tables with, e.g. a wrapper script taking VPX's arguments.
# Defaults to VPinballX_BGFX, VPinballX_GL or VPinballX in the installation folder.
visualPinball.executable=/home/mfaust/vpx/VPinballX_GL
# Optional: defaults to the newest ~/.local/share/VPinballX/<version>/VPinballX.ini
visualPinball.configFile=
# Optional: defaults to <installationDir>/Tables
visualPinball.tablesFolder=/home/mfaust/vpx/tables

# Features that are off by default on Linux (or in Standalone mode) can be switched back on,
# e.g. HIGHSCORE_MONITORING. CONTROLS_ENABLED and OVERLAY_ENABLED show the pause menu and
# overlay preferences.
system.featuresOn=CONTROLS_ENABLED,OVERLAY_ENABLED
