# Launch4j runtime config
-Dfile.encoding=utf-8
--add-exports=javafx.graphics/com.sun.javafx.iio=ALL-UNNAMED
--add-exports=javafx.graphics/com.sun.javafx.iio.common=ALL-UNNAMED
--enable-native-access=javafx.graphics
# Disables the AWT/Java2D Direct3D pipeline (does not affect JavaFX/Prism rendering).
# Works around JDK-8341382: EXCEPTION_ACCESS_VIOLATION in awt.dll on WM_DISPLAYCHANGE
# (monitor power-save, mode switch, VR headset hotplug) on multi-monitor cabinets.
-Dsun.java2d.d3d=false
#-Duser.country=US
#-Duser.language=en